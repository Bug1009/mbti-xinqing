<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFF8F0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">

<title>心晴计划 · 人格小测</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
    background:#FFF8F0;color:#3D3A36;line-height:1.7;
    min-height:100vh;
    background-image:radial-gradient(circle at 12% 8%,#FFE7CE 0,transparent 42%),
                     radial-gradient(circle at 88% 92%,#FDECD9 0,transparent 38%);
    background-attachment:fixed;
  }
  .wrap{max-width:680px;margin:0 auto;padding:28px 20px 56px}
  .card{background:#fff;border-radius:22px;padding:26px 24px;box-shadow:0 8px 28px rgba(214,158,110,.13)}
  h1{font-size:26px;line-height:1.4;margin:0 0 6px;letter-spacing:.5px}
  .sub{color:#9C8E80;font-size:14px;margin:0 0 22px}
  .lead{font-size:16px;color:#5A544D;margin:0 0 16px}
  ul.tips{margin:0 0 26px;padding-left:20px;color:#6B635B;font-size:15px}
  ul.tips li{margin:7px 0}
  .btn{
    display:block;width:100%;border:0;border-radius:16px;padding:15px 18px;
    font-size:17px;font-family:inherit;font-weight:600;cursor:pointer;
    background:#F0913F;color:#fff;transition:.18s;
  }
  .btn:hover{background:#E4812C}
  .btn:active{transform:scale(.99)}
  .btn.ghost{background:#FFF1E2;color:#C9741F;font-weight:500}
  .btn.ghost:hover{background:#FFE7CE}
  .row{display:flex;gap:12px;margin-top:14px}
  .row .btn{margin:0}
  /* 答题 */
  .topbar{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#A2937F;margin-bottom:10px}
  .bar{height:8px;background:#FFEBD6;border-radius:99px;overflow:hidden;margin-bottom:22px}
  .bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#F6B675,#EB8B3C);border-radius:99px;transition:width .3s ease}
  .qnum{font-size:13px;color:#C9741F;letter-spacing:1px;margin-bottom:8px}
  .stem{font-size:19px;line-height:1.62;margin:0 0 20px;font-weight:600}
  .opts{display:flex;flex-direction:column;gap:11px}
  .opt{
    display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
    background:#FFFBF6;border:1.5px solid #F6E3CE;border-radius:15px;
    padding:14px 15px;font-size:16px;font-family:inherit;color:#423D37;
    cursor:pointer;transition:.15s;line-height:1.6;
  }
  .opt:hover{border-color:#F0B47A;background:#FFF5EA}
  .opt.sel{border-color:#EB8B3C;background:#FFEFDD}
  .opt b{
    flex:0 0 24px;height:24px;border-radius:8px;background:#FFEBD6;color:#C9741F;
    font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px
  }
  .opt.sel b{background:#EB8B3C;color:#fff}
  .nav{display:flex;justify-content:space-between;align-items:center;margin-top:18px;font-size:14px}
  .link{color:#A2937F;background:none;border:0;font-family:inherit;font-size:14px;cursor:pointer;padding:6px 2px}
  .link:hover{color:#C9741F}
  /* 结果 */
  .code{
    font-size:56px;font-weight:800;letter-spacing:6px;color:#E4812C;margin:2px 0 4px;
    font-family:"Segoe UI",system-ui,sans-serif
  }
  .desc{font-size:17px;color:#4C463F;margin:0 0 24px}
  .dim{padding:15px 0;border-top:1px dashed #F2E2CE}
  .dim:first-of-type{border-top:0}
  .dim h3{margin:0 0 9px;font-size:15px;font-weight:600;display:flex;justify-content:space-between;color:#4C463F}
  .dim h3 span{color:#C9741F;font-weight:700}
  .track{height:9px;background:#FFEBD6;border-radius:99px;display:flex;overflow:hidden}
  .track i{display:block;height:100%}
  .track .l{background:linear-gradient(90deg,#F3A85C,#EA8C3D)}
  .track .r{background:#F7DCC2}
  .dim p{margin:9px 0 0;font-size:14px;color:#7A7168;line-height:1.75}
  .foot{text-align:center;font-size:12px;color:#B4A79A;margin-top:26px;line-height:1.8}
  .hide{display:none!important}
  @media (max-width:420px){
    .wrap{padding:20px 14px 44px}
    .card{padding:22px 18px;border-radius:18px}
    h1{font-size:23px}
    .stem{font-size:17.5px}
    .code{font-size:48px}
  }
</style>
<style>
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{overscroll-behavior-y:contain;padding-bottom:env(safe-area-inset-bottom)}
  .wrap{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
  .opt{min-height:56px;touch-action:manipulation}
  .btn{min-height:52px;touch-action:manipulation}
  .link{min-height:40px;padding:10px 4px}
  @media (hover:none){.opt:hover{border-color:#F6E3CE;background:#FFFBF6}}
  @media (max-width:400px){
    h1{font-size:22px}
    .stem{font-size:17px}
    .opt{font-size:15.5px;padding:13px 14px}
    .code{font-size:46px;letter-spacing:4px}
    .dim h3{font-size:14px}
    .dim h3 span{font-size:14px}
  }
</style>
<style>
  /* v2 视觉与交互 */
  .card{animation:cardIn .34s cubic-bezier(.22,.8,.3,1) both}
  @keyframes cardIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin:-8px 0 22px}
  .chip{background:#FFF1E2;color:#B26A22;font-size:12.5px;padding:7px 12px;border-radius:99px;line-height:1;white-space:nowrap}
  .bar{position:relative}
  .bar>i{box-shadow:0 0 10px rgba(240,145,63,.45)}
  .topbar #pct{font-weight:700;color:#C9741F}
  .qnum{font-variant-numeric:tabular-nums}
  .stem{animation:stemIn .26s ease both}
  @keyframes stemIn{from{opacity:0;transform:translateX(8px)}to{opacity:1;transform:none}}
  .opt{position:relative;padding-right:38px}
  .opt:active{transform:scale(.985)}
  .opt.sel{box-shadow:0 4px 14px rgba(235,139,60,.16)}
  .opt.sel::after{content:"\2713";position:absolute;right:14px;top:50%;transform:translateY(-50%);color:#EB8B3C;font-weight:700;font-size:15px}
  .codewrap{background:linear-gradient(135deg,#FFF4E7,#FFE7CE);border-radius:18px;padding:18px 20px 20px;margin:0 0 18px;text-align:center}
  .codewrap .code{letter-spacing:8px}
  .dimhead{display:flex;justify-content:space-between;font-size:12.5px;color:#A2937F;margin:0 0 6px}
  .dimrow{display:flex;align-items:center;gap:9px;margin:0 0 9px}
  .dimrow>b{flex:0 0 15px;text-align:center;font-size:15px;color:#B4A79A}
  .dimrow>b.on{color:#E4812C}
  .dimrow .pctv{flex:0 0 38px;text-align:center;font-size:12.5px;color:#9C8E80;font-variant-numeric:tabular-nums}
  .dimrow .track{flex:1}
  .dimrow .track .l{background:linear-gradient(90deg,#F3A85C,#EA8C3D)}
  .dimrow .track .r{background:#F7DCC2}
  .dim p{margin:6px 0 0}
  @media (max-width:400px){
    .code{letter-spacing:6px;font-size:42px}
    .chip{font-size:12px;padding:6px 10px}
    .dimrow .pctv{flex:0 0 34px;font-size:12px}
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- 开始页 -->
  <section id="s-intro" class="card">
    <h1>心晴计划 · 人格小测</h1>
    <p class="sub">96 题 · 大约十几分钟 · 不需要登录</p>
    <div class="chips">
      <span class="chip">96 道题</span>
      <span class="chip">约 15 分钟</span>
      <span class="chip">不用注册</span>
      <span class="chip">答案只在本机</span>
    </div>
    <p class="lead">每题选一个最接近你的答案。第一反应通常更准，没有对错，也不用挑“应该选的那个”。</p>
    <ul class="tips">
      <li>答案只存在你自己的浏览器里，不会上传，也没有账号。</li>
      <li>中途关了页面也没关系，下次打开可以从上次那题接着做。</li>
      <li>结果只是给你一个看自己的角度，不用当成标签贴在自己身上。</li>
    </ul>
    <button class="btn" id="btn-start">开始作答</button>
    <div class="row hide" id="resume-row">
      <button class="btn ghost" id="btn-resume">继续上次（第 <span id="resume-n">1</span> 题）</button>
      <button class="btn ghost" id="btn-reset">重新开始</button>
    </div>
  </section>

  <!-- 答题页 -->
  <section id="s-quiz" class="card hide">
    <div class="topbar">
      <span id="pos">第 1 题 / 共 96 题</span>
      <span id="pct">0%</span>
    </div>
    <div class="bar"><i id="barfill"></i></div>
    <div class="qnum" id="qnum">01</div>
    <p class="stem" id="stem"></p>
    <div class="opts" id="opts"></div>
    <div class="nav">
      <button class="link" id="btn-prev">← 上一题</button>
      <button class="link" id="btn-quit">退出</button>
    </div>
  </section>

  <!-- 结果页 -->
  <section id="s-result" class="card hide">
    <div class="codewrap">
      <p class="sub" style="margin:0 0 4px">你的人格类型是</p>
      <div class="code" id="code">INFP</div>
    </div>
    <p class="desc" id="desc"></p>
    <div id="dims"></div>
    <div class="row">
      <button class="btn ghost" id="btn-again">重新测一次</button>
      <button class="btn" id="btn-save">保存结果文件</button>
    </div>
    <button class="btn ghost" id="btn-copy" style="margin-top:12px">复制结果文字</button>
    <p class="foot">本测试仅作自我观察的参考，不构成心理诊断。<br>心晴计划 · 答案不上传、不收集</p>
  </section>

</div>

<script>

var KEY = "xq_mbti_v1";
var DIMS = [
  {a:"E", b:"I", name:"精力来源", ea:"你更容易从与人相处里回血，聊起来会更有精神。", eb:"你更需要独处来恢复，人多的场合容易消耗你。"},
  {a:"S", b:"N", name:"接收信息", ea:"你更信具体的经验和看得见的事实，习惯先把眼前的事弄明白。", eb:"你更容易被可能性吸引，会顺着一个点想到很远的地方。"},
  {a:"T", b:"F", name:"做决定", ea:"你判断时先看是否说得通、是否站得住。", eb:"你判断时先想这件事对人意味着什么，会不会让人难受。"},
  {a:"J", b:"P", name:"生活节奏", ea:"你倾向于早点把事情定下来，定好了心里才踏实。", eb:"你更愿意留点余地，事情到跟前再定反而更自在。"}
];

var Q = DATA.questions, T = DATA.types;
var answers = new Array(Q.length).fill(-1);
var cur = 0, picking = false;

var $ = function(id){ return document.getElementById(id); };
var intro = $("s-intro"), quiz = $("s-quiz"), res = $("s-result");

function save(){
  try{ localStorage.setItem(KEY, JSON.stringify({a:answers, c:cur})); }catch(e){}
}
function load(){
  try{
    var s = JSON.parse(localStorage.getItem(KEY) || "null");
    if(s && s.a && s.a.length === Q.length){
      answers = s.a; cur = Math.min(s.c || 0, Q.length - 1);
      return true;
    }
  }catch(e){}
  return false;
}
function clear(){ try{ localStorage.removeItem(KEY); }catch(e){} }

function show(el){
  [intro, quiz, res].forEach(function(x){ x.classList.add("hide"); });
  el.classList.remove("hide");
  window.scrollTo(0, 0);
}

function answeredCount(){
  var n = 0;
  for(var i = 0; i < answers.length; i++){ if(answers[i] >= 0) n++; }
  return n;
}

function render(){
  var q = Q[cur];
  $("pos").textContent = "第 " + (cur + 1) + " 题 / 共 " + Q.length + " 题";
  var p = Math.round(answeredCount() / Q.length * 100);
  $("pct").textContent = p + "%";
  $("barfill").style.width = p + "%";
  $("qnum").textContent = (cur + 1 < 10 ? "0" : "") + (cur + 1);
  $("stem").textContent = q.q;
  var box = $("opts");
  box.innerHTML = "";
  ["A","B","C","D"].forEach(function(letter, i){
    var b = document.createElement("button");
    b.className = "opt" + (answers[cur] === i ? " sel" : "");
    b.innerHTML = '<b>' + letter + '</b><span></span>';
    b.lastChild.textContent = q.o[i];
    b.onclick = function(){ pick(i); };
    box.appendChild(b);
  });
  $("btn-prev").style.visibility = cur === 0 ? "hidden" : "visible";
}

function pick(i){
  if(picking) return;
  picking = true;
  if(navigator.vibrate){ try{ navigator.vibrate(8); }catch(e){} }
  answers[cur] = i;
  save();
  render();
  setTimeout(function(){
    picking = false;
    if(answeredCount() === Q.length && cur === Q.length - 1){ finish(); return; }
    if(cur < Q.length - 1){ cur++; save(); render(); }
    else { finish(); }
  }, 170);
}

function nextOpen(){
  for(var i = 0; i < Q.length; i++){ if(answers[i] < 0) return i; }
  return Q.length - 1;
}

function finish(){
  var totals = [0,0,0,0];
  for(var i = 0; i < Q.length; i++){
    var g = Math.floor(i / 24);
    totals[g] += Q[i].s[answers[i]];
  }
  var code = "";
  var html = "";
  DIMS.forEach(function(d, g){
    var sc = totals[g];
    var first = sc >= 0;
    var codeLetter = first ? d.a : d.b;
    code += codeLetter;
    var pct = Math.round((sc + 48) / 96 * 100);
    var leftPct = first ? pct : 100 - pct;
    html += '<div class="dim">'
         + '<div class="dimhead"><span>' + d.name + '</span><span>' + d.a + ' ← → ' + d.b + '</span></div>'
         + '<div class="dimrow"><b class="' + (first ? 'on' : '') + '">' + d.a + '</b>'
         + '<span class="pctv">' + leftPct + '%</span>'
         + '<div class="track"><i class="l" style="width:' + leftPct + '%"></i><i class="r" style="width:' + (100 - leftPct) + '%"></i></div>'
         + '<span class="pctv">' + (100 - leftPct) + '%</span>'
         + '<b class="' + (first ? '' : 'on') + '">' + d.b + '</b></div>'
         + '<p>' + (first ? d.ea : d.eb) + '</p></div>';
  });
  $("code").textContent = code;
  $("desc").textContent = T[code] || "";
  $("dims").innerHTML = html;
  clear();
  show(res);
}

$("btn-start").onclick = function(){
  answers = new Array(Q.length).fill(-1);
  cur = 0; clear(); render(); show(quiz);
};
$("btn-prev").onclick = function(){
  if(cur > 0){ cur--; save(); render(); }
};
$("btn-quit").onclick = function(){
  save();
  if(answeredCount() > 0){
    intro.querySelector(".lead").textContent = "进度已经存下来了，随时可以接着做。";
    $("resume-n").textContent = nextOpen() + 1;
    $("resume-row").classList.remove("hide");
  }
  show(intro);
};
$("btn-resume").onclick = function(){
  cur = nextOpen(); render(); show(quiz);
};
$("btn-reset").onclick = function(){
  answers = new Array(Q.length).fill(-1);
  cur = 0; clear();
  $("resume-row").classList.add("hide");
  $("btn-start").textContent = "开始作答";
  show(intro);
};
$("btn-again").onclick = function(){
  answers = new Array(Q.length).fill(-1);
  cur = 0; clear(); render(); show(quiz);
};
function buildText(){
  var out = ["心晴计划 · 人格小测", "", $("code").textContent, $("desc").textContent, ""];
  var els = document.querySelectorAll("#dims .dim");
  for(var i = 0; i < els.length; i++){
    var d = DIMS[i];
    var pv = els[i].querySelectorAll(".pctv");
    out.push(d.name + "　" + d.a + " " + pv[0].textContent + " / " + d.b + " " + pv[1].textContent);
    out.push(els[i].querySelector("p").textContent);
    out.push("");
  }
  return out.join("\n");
}
function fallbackCopy(txt){
  var ta = document.createElement("textarea");
  ta.value = txt; ta.style.position = "fixed"; ta.style.top = "-1000px"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); }catch(e){}
  document.body.removeChild(ta);
}
$("btn-save").onclick = function(){
  var txt = buildText();
  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([txt], {type:"text/plain;charset=utf-8"}));
  a.download = "心晴计划-结果-" + $("code").textContent + ".txt";
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
};
$("btn-copy").onclick = function(){
  var txt = buildText(), btn = this, back = function(){
    btn.textContent = "已复制到剪贴板";
    setTimeout(function(){ btn.textContent = "复制结果文字"; }, 1600);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(back, function(){ fallbackCopy(txt); back(); });
  } else { fallbackCopy(txt); back(); }
};

document.addEventListener("keydown", function(e){
  if(quiz.classList.contains("hide")) return;
  var k = e.key.toUpperCase();
  var idx = ["A","B","C","D"].indexOf(k);
  if(idx < 0 && k >= "1" && k <= "4") idx = parseInt(k, 10) - 1;
  if(idx >= 0) pick(idx);
  if(e.key === "ArrowLeft"){ if(cur > 0){ cur--; save(); render(); } }
});

if(load()){
  $("resume-n").textContent = nextOpen() + 1;
  $("resume-row").classList.remove("hide");
  $("btn-start").textContent = "重新开始";
}
render();
</script>
</body>
</html>
